services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: csv-processing-api:latest
    container_name: csv-processing-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ApiKey__Key: ${API_KEY:?API_KEY must be set - copy .env.example to .env and set it}
      ConnectionStrings__DefaultConnection: Data Source=/app/data/csvprocessing.db
      Database__ApplyMigrationsOnStartup: "true"
    volumes:
      - csv-data:/app/data
    restart: unless-stopped

volumes:
  csv-data:
